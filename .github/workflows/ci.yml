name: Tapeout Package CI & Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-metadata:
    name: Validate IHP Open-Silicon-MPW Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate info.json and categories
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import sys
          from pathlib import Path

          info_path = Path("doc/info.json")
          if not info_path.is_file():
              print("ERROR: doc/info.json not found!", file=sys.stderr)
              sys.exit(1)

          data = json.loads(info_path.read_text(encoding="utf-8"))
          required_fields = ["name", "design_type", "technology", "unique_id", "license", "process", "sealring_x", "sealring_y", "top_cell_name", "release"]
          missing = [f for f in required_fields if not data.get(f)]
          if missing:
              print(f"ERROR: Missing required fields in doc/info.json: {missing}", file=sys.stderr)
              sys.exit(1)

          # Verify category and subcategory against scripts/ip-categories.json
          cat_path = Path("scripts/ip-categories.json")
          if cat_path.is_file():
              categories = json.loads(cat_path.read_text(encoding="utf-8"))
              name = data.get("name", "")
              subcat_abbrev = "".join([c for c in name if c.isalpha()])
              found = False
              for c_name, subcats in categories.items():
                  for s_full, s_abbrev in subcats.items():
                      if s_abbrev == subcat_abbrev:
                          print(f"Category verified from IP name '{name}': {c_name} -> {s_full} ({s_abbrev})")
                          found = True
                          break
                  if found:
                      break
              if not found:
                  print(f"ERROR: Unknown subcategory abbreviation '{subcat_abbrev}' from name '{name}'", file=sys.stderr)
                  sys.exit(1)

          print("doc/info.json validation: SUCCESS!")
          PY

  verify-file-integrity:
    name: Verify Deliverable Files Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required tapeout files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "design_data/gds/PLL3540.gds"
            "design_data/gds/PLL3540.gds.gz"
            "design_data/def/dpll_testchip.def"
            "design_data/cdl/dpll_testchip_schematic.cdl"
            "design_data/cdl/PLL3540.cdl"
            "PLL3540-main/README.md"
            "PLL3540-main/layout/klayout/PLL3540.gds"
            "PLL3540-main/layout/def/PLL3540.def"
            "PLL3540-main/netlist/schematic/PLL3540.cdl"
            "release/v.1.0.0/gds/PLL3540.gds.gz"
            "release/v.1.0.0/netlist/PLL3540.cdl"
            "release/v.1.0.0/netlist/dpll_testchip_schematic.cdl"
            "release/v.1.0.0/doc/testchip_documentation.pdf"
            "doc/testchip_documentation.pdf"
            "doc/Specification.md"
            "doc/Datasheet.md"
            "doc/TRL-Mixed-Signal-IP.md"
            "val/drc/drc_summary.rpt"
            "val/drc/density_summary.rpt"
            "val/lvs/lvs_summary.rpt"
          )
          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "ERROR: File missing or empty: $f"
              exit 1
            fi
            echo "OK: $f ($(du -h "$f" | cut -f1))"
          done
          echo "All required files verified successfully!"

  verify-signoff-reports:
    name: Verify Sign-Off Reports (DRC / LVS / Density)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check DRC summary
        shell: bash
        run: |
          grep "Number of DRC errors: 0" val/drc/drc_summary.rpt || { echo "DRC check failed!"; exit 1; }
          echo "DRC check: 0 errors verified."

      - name: Check LVS summary
        shell: bash
        run: |
          grep "INFO : Congratulations! Netlists match." val/lvs/lvs_summary.rpt || { echo "LVS check failed!"; exit 1; }
          echo "LVS check: Netlists match verified."

      - name: Check Density summary
        shell: bash
        run: |
          grep "Overall Sign-off Status: 100% PASS" val/drc/density_summary.rpt || { echo "Density check failed!"; exit 1; }
          echo "Density check: 100% PASS verified."

  klayout-physical-verification:
    name: Live KLayout GDS Physical Verification (DRC, Density, Sealring, Pins)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install KLayout
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo apt-get update -y
          sudo -E apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            klayout

      - name: Run KLayout Verification Suite on Live GDS
        shell: bash
        run: |
          klayout -b -r scripts/run_klayout_verification.py

