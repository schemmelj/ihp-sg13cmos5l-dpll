name: Physical Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verification:
    name: IHP Physical Verification & DRC Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update -qq -y
          sudo apt-get install -y jq klayout python3-pip

      - name: Resolve release inputs from doc/info.json
        id: resolve-inputs
        shell: bash
        run: |
          set -euo pipefail
          GDS_PATH=$(jq -r '.release.gds // empty' doc/info.json)
          NETLIST_PATH=$(jq -r '.release.netlist // empty' doc/info.json)

          if [[ -z "$GDS_PATH" || "$GDS_PATH" == "null" ]]; then
            echo "::error::No release.gds referenced in doc/info.json."
            exit 1
          fi

          if [[ ! -f "$GDS_PATH" ]]; then
            echo "::error::release.gds references a missing file: $GDS_PATH"
            exit 1
          fi

          if [[ -n "$NETLIST_PATH" && "$NETLIST_PATH" != "null" && ! -f "$NETLIST_PATH" ]]; then
            echo "::error::release.netlist references a missing file: $NETLIST_PATH"
            exit 1
          fi

          echo "gds_path=$GDS_PATH" >> "$GITHUB_OUTPUT"
          echo "netlist_path=$NETLIST_PATH" >> "$GITHUB_OUTPUT"
          echo "Found valid release GDS: $GDS_PATH"
          echo "Found valid release netlist: $NETLIST_PATH"

      - name: Run KLayout Physical Verification Suite
        shell: bash
        run: |
          klayout -b -r scripts/run_klayout_verification.py

      - name: Archive Verification Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-Results
          path: |
            val/drc/
            val/lvs/
