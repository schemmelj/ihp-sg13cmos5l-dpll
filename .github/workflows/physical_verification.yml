name: Physical Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verification:
    name: IHP Physical Verification & DRC Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          sudo apt-get update -y
          sudo -E apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            jq klayout python3-pip

      - name: Resolve release inputs from doc/info.json
        id: resolve-inputs
        shell: bash
        run: |
          set -euo pipefail
          GDS_PATH=$(jq -r '.release.gds // empty' doc/info.json)
          NETLIST_PATH=$(jq -r '.release.netlist // empty' doc/info.json)

          if [[ -z "$GDS_PATH" || "$GDS_PATH" == "null" ]]; then
            echo "::error::No release.gds referenced in doc/info.json."
            exit 1
          fi

          if [[ -d "$GDS_PATH" ]]; then
            GDS_FILE=$(find "$GDS_PATH" -maxdepth 1 -name "*.gds*" | head -n 1)
          else
            GDS_FILE="$GDS_PATH"
          fi

          if [[ -z "$GDS_FILE" || ! -f "$GDS_FILE" ]]; then
            echo "::error::release.gds references a missing file or empty directory: $GDS_PATH"
            exit 1
          fi

          if [[ -n "$NETLIST_PATH" && "$NETLIST_PATH" != "null" ]]; then
            if [[ -d "$NETLIST_PATH" ]]; then
              NETLIST_FILE=$(find "$NETLIST_PATH" -maxdepth 1 \( -name "*.cdl*" -o -name "*.spice*" -o -name "*.sp*" \) | head -n 1)
            else
              NETLIST_FILE="$NETLIST_PATH"
            fi
            if [[ -z "$NETLIST_FILE" || ! -f "$NETLIST_FILE" ]]; then
              echo "::error::release.netlist references a missing file or empty directory: $NETLIST_PATH"
              exit 1
            fi
          else
            NETLIST_FILE=""
          fi

          echo "gds_path=$GDS_FILE" >> "$GITHUB_OUTPUT"
          echo "netlist_path=$NETLIST_FILE" >> "$GITHUB_OUTPUT"
          echo "Found valid release GDS: $GDS_FILE"
          echo "Found valid release netlist: $NETLIST_FILE"

      - name: Run KLayout Physical Verification Suite
        shell: bash
        run: |
          klayout -b -r scripts/run_klayout_verification.py

      - name: Archive Verification Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-Results
          path: |
            val/drc/
            val/lvs/
